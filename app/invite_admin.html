<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Weeklyst — Uitnodiging sturen</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #dde8f4; --surface: #eef3fa; --border: #b8ccdf;
  --text: #1a2433; --muted: #4a6480; --accent: #2b6cb0;
  --success: #2f855a; --danger: #c0392b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 2rem 1.75rem; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(43,108,176,0.08); }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 1.75rem; }
.logo img { width: 38px; height: 38px; border-radius: 10px; }
.logo-name { font-size: 20px; font-weight: 600; color: var(--accent); }
.logo-sub { font-size: 11px; color: var(--muted); }
.card-title { font-size: 19px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.card-sub { font-size: 13px; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.5; }
.field { margin-bottom: 1rem; }
.f-label { display: block; font-size: 11px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.f-input { width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px; font-family: 'Outfit', sans-serif; font-size: 15px; color: var(--text); background: var(--bg); outline: none; transition: border-color .15s, box-shadow .15s; }
.f-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(43,108,176,0.12); }
textarea.f-input { resize: vertical; min-height: 80px; }
.btn { width: 100%; border: none; border-radius: 9px; padding: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; background: var(--accent); color: #fff; transition: opacity .15s; margin-top: .25rem; }
.btn:hover { opacity: .9; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.msg { font-size: 13px; padding: 10px 13px; border-radius: 8px; margin-bottom: 1rem; display: none; line-height: 1.4; }
.msg.show { display: block; }
.msg.ok  { background: #f0fdf4; color: var(--success); border: 1px solid #86efac; }
.msg.err { background: #fef2f2; color: var(--danger);  border: 1px solid #fca5a5; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 6px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }
.hint { font-size: 12px; color: var(--muted); margin-top: 5px; }

/* Type keuze */
.type-choice { display: flex; gap: 8px; margin-bottom: 1.25rem; }
.type-opt {
  flex: 1; padding: 10px 8px; border: 2px solid var(--border);
  border-radius: 10px; cursor: pointer; text-align: center;
  transition: all .15s; background: var(--bg);
}
.type-opt:hover { border-color: var(--accent); }
.type-opt.active { border-color: var(--accent); background: rgba(43,108,176,0.06); }
.type-opt-icon { font-size: 20px; margin-bottom: 4px; }
.type-opt-label { font-size: 12px; font-weight: 500; color: var(--text); }
.type-opt-sub { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
</style>
</head>

    <div>
      <div class="logo-name">Weeklyst</div>
      <div class="logo-sub">Uitnodiging sturen</div>
    </div>
  </div>

  <div class="card-title">Iemand uitnodigen</div>
  <div class="card-sub">Kies het type uitnodiging en vul de gegevens in.</div>

  <div class="msg" id="msg"></div>

  <div class="field">
    <label class="f-label">Admin wachtwoord</label>
    <input class="f-input" id="adminPass" type="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <hr class="divider">

  <!-- Type keuze -->
  <div class="f-label" style="margin-bottom:8px">Type uitnodiging</div>
  <div class="type-choice">
    <div class="type-opt active" id="typeFamily" onclick="setType('family')">
      <div class="type-opt-icon">👨‍👩‍👧‍👦</div>
      <div class="type-opt-label">Gezin uitnodigen</div>
      <div class="type-opt-sub">Met uitnodigingscode om mee te doen</div>
    </div>
    <div class="type-opt" id="typeTest" onclick="setType('test')">
      <div class="type-opt-icon">👀</div>
      <div class="type-opt-label">Laten zien</div>
      <div class="type-opt-sub">Bekijken en testen, geen gezinscode</div>
    </div>
  </div>

  <hr class="divider">

  <div class="field">
    <label class="f-label">Naam ontvanger</label>
    <input class="f-input" id="toName" type="text" placeholder="bijv. Lisa">
  </div>
  <div class="field">
    <label class="f-label">E-mailadres ontvanger</label>
    <input class="f-input" id="toEmail" type="email" placeholder="lisa@voorbeeld.nl">
  </div>

  <!-- Alleen zichtbaar bij type 'family' -->
  <div id="inviteCodeField" class="field">
    <label class="f-label">Uitnodigingscode</label>
    <input class="f-input" id="invCode" type="text" maxlength="6" placeholder="bijv. ABC123" style="letter-spacing:4px;font-weight:600;text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
    <div class="hint">Vind je code in de app onder ⚙️ Instellingen → Uitnodigingscode</div>
  </div>

  <div class="field">
    <label class="f-label">Jouw naam (als afzender)</label>
    <input class="f-input" id="fromName" type="text" placeholder="bijv. Tim">
  </div>
  <div class="field">
    <label class="f-label">Persoonlijk berichtje <span style="font-weight:300;text-transform:none;letter-spacing:0">(optioneel)</span></label>
    <textarea class="f-input" id="personalMsg" placeholder="bijv. Super handig voor onze weekplanning, probeer het eens!"></textarea>
  </div>

  <button class="btn" id="sendBtn" onclick="sendInvite()">Uitnodiging versturen</button>
</div>

<script>
let inviteType = 'family';

function setType(type) {
  inviteType = type;
  document.getElementById('typeFamily').classList.toggle('active', type === 'family');
  document.getElementById('typeTest').classList.toggle('active', type === 'test');
  document.getElementById('inviteCodeField').style.display = type === 'family' ? 'block' : 'none';
  document.getElementById('sendBtn').textContent = type === 'family'
    ? 'Uitnodiging versturen'
    : 'Uitnodiging versturen';
}

async function sendInvite() {
  const msg       = document.getElementById('msg');
  const btn       = document.getElementById('sendBtn');
  const adminPass = document.getElementById('adminPass').value;
  const toName    = document.getElementById('toName').value.trim();
  const toEmail   = document.getElementById('toEmail').value.trim();
  const invCode   = document.getElementById('invCode').value.trim().toUpperCase();
  const fromName  = document.getElementById('fromName').value.trim();
  const personalMsg = document.getElementById('personalMsg').value.trim();

  msg.className = 'msg'; msg.textContent = '';
  if (!adminPass) { showMsg('Vul het admin wachtwoord in.', 'err'); return; }
  if (!toName)    { showMsg('Vul de naam van de ontvanger in.', 'err'); return; }
  if (!toEmail)   { showMsg('Vul een e-mailadres in.', 'err'); return; }
  if (inviteType === 'family' && invCode.length !== 6) {
    showMsg('Vul een geldige uitnodigingscode in (6 tekens).', 'err'); return;
  }
  if (!fromName)  { showMsg('Vul jouw naam in als afzender.', 'err'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Even geduld…';

  try {
    const resp = await fetch('invite.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        admin_password: adminPass,
        type: inviteType,
        name: toName,
        email: toEmail,
        invite_code: inviteType === 'family' ? invCode : '',
        from_name: fromName,
        personal_msg: personalMsg,
      })
    });
    const data = await resp.json();
    if (data.ok) {
      showMsg('✓ ' + data.message, 'ok');
      document.getElementById('toName').value = '';
      document.getElementById('toEmail').value = '';
      document.getElementById('invCode').value = '';
      document.getElementById('personalMsg').value = '';
    } else {
      showMsg(data.error || 'Er ging iets mis.', 'err');
    }
  } catch(e) {
    showMsg('Verbindingsfout, probeer opnieuw.', 'err');
  }

  btn.disabled = false;
  btn.textContent = 'Uitnodiging versturen';
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && document.activeElement.tagName !== 'TEXTAREA') sendInvite();
});
</script>
</body>
</html>
